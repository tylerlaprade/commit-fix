[package]
name = "commit-fix"
version = "0.2.1"
edition = "2021"
description = "Fix Rust code as you commit without disturbing concurrent work."
license = "GPL-3.0-only"
repository = "https://github.com/tylerlaprade/commit-fix"
keywords = ["git", "hooks", "lint", "format", "pre-commit"]
categories = ["development-tools"]
readme = "README.md"

[[bin]]
name = "commit-fix"
path = "src/main.rs"

[dependencies]
rustfix = "0.9.7"
serde_json = "1.0.151"
