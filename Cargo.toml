[package]
name = "commit-fix"
version = "0.2.0"
edition = "2021"
description = "Zero-config pre-commit auto-fix for Rust: rustfmt, clippy fixes, and lockfile freshening staged into the commit — safe with concurrent writers, never blocks."
license = "MIT"
repository = "https://github.com/tylerlaprade/commit-fix"
keywords = ["git", "hooks", "lint", "format", "pre-commit"]
categories = ["development-tools"]
readme = "README.md"

[[bin]]
name = "commit-fix"
path = "src/main.rs"

[dependencies]
rustfix = "0.9.7"
serde_json = "1.0.151"
